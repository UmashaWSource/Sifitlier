name: mobile_app
description: "Sifitlier - AI-powered spam detection and data loss prevention app"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # URL Launcher for Telegram
  url_launcher: ^6.2.1

  # UI & Icons
  cupertino_icons: ^1.0.2
  
  # HTTP Client (for API calls)
  http: ^1.2.0
  
  # Gmail OAuth packages (Compatible with Dart 3.2.6)
  google_sign_in: ^6.1.6
  googleapis: ^11.4.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.10
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Utilities
  intl: ^0.18.1
  
  # SMS Reading (Android only)
  telephony: ^0.2.0
  
  # Permissions handling
  permission_handler: ^11.1.0
  
  # Local Notifications (for spam alerts)
  flutter_local_notifications: ^16.3.0
  
  # Clipboard monitoring
  clipboard_watcher: ^0.2.1
  
  # Background service
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
